services:
    libretranslate:
        image: libretranslate/libretranslate:v1.6.5
        restart: ${RESTART_POLICY:-unless-stopped}
        ports:
          - "5000:5000"
        healthcheck:
            test: ['CMD-SHELL', './venv/bin/python scripts/healthcheck.py']     
        environment:
            - LT_UPDATE_MODELS=true
            - LT_LOAD_ONLY=en,de
            - ARGOS_DEBUG=1
        volumes:
            - ${CONFIG}/libretranslate/local:/home/libretranslate/.local:Z
            - ${CONFIG}/libretranslate/keys:/app/db:Z
        networks:
            meet.jitsi:
